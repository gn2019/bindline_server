<!-- Bootstrap + FontAwesome -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>
<script src="{{ url_for('static', filename='toast.js') }}"></script>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

<nav class="d-flex justify-content-between align-items-center mb-4">
    <div class="d-flex align-items-center gap-5 ms-4">
        <a href="{{ url_for('help_page') }}" class="text-decoration-none fw-semibold text-secondary nav-link-hover nav-big">
            <i class="fas fa-circle-question me-1"></i> Help
        </a>
        <a href="{{ url_for('data_page') }}" class="text-decoration-none fw-semibold text-secondary nav-link-hover nav-big">
            <i class="fas fa-database me-1"></i> Data
        </a>
    </div>

    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="BindLine"
     class="no-zoom" style="cursor: pointer; font-size: 2rem; width: 15%; height: auto;"
     onclick="window.location.href='{{ url_for('index') }}'">

    <div class="d-flex align-items-center">
        <span class="me-3" style="font-size: 1.2rem; font-weight: bold;">
            {{ current_user.username }}
        </span>
        <div class="dropdown">
            <button class="btn btn-outline-primary dropdown-toggle d-flex align-items-center"
                    type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false"
                    style="font-size: 1.5rem;">
                <i class="fas fa-user-circle"></i>
            </button>

            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                {% if is_authenticated %}
                    <li><a class="dropdown-item" href="{{ url_for('dashboard') }}">Dashboard</a></li>
                    <li><a class="dropdown-item" href="{{ url_for('auth.logout', next=request.path or url_for('index')) }}">Log Out</a></li>
                {% else %}
                    <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Log In</a></li>
                    <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#registerModal">Sign Up</a></li>
                {% endif %}
            </ul>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal"  data-url-login="{{ url_for('auth.login') }}" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="loginUsername" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Log In</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" data-url-register="{{ url_for('auth.register') }}" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">Sign Up</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerUsername" class="form-label">Username (English letters and digits only, 3-20 characters long)</label>
                            <!-- alphanumeric and 3-20 characters long -->
                            <input type="text" class="form-control" id="registerUsername" name="username" pattern="^[a-zA-Z0-9]{3,20}$" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="registerPassword" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Sign Up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
