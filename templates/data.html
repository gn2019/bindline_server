<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="container py-4">
    <!-- Header with clickable BindLine title -->
    <h3 class="text-center text-primary mb-4" style="cursor: pointer;" onclick="redirectToIndex()">BindLine</h3>

    <div class="text-center mb-4">
        <h1 class="h4">Public Data Download</h1>
    </div>

    <div class="row">
        <!-- Fasta Files Section -->
        <div class="col-md-6">
            <h2 class="h5 text-secondary">Fasta Files</h2>
            <form method="POST" action="{{ url_for('bulk_action', file_type='fasta', is_public=true) }}">
                <div class="mb-2">
                    <input type="checkbox" id="checkAllFasta" onclick="toggleAll('fasta')"> Check all
                </div>
                <ul class="list-group">
                    {% for file in fasta_files %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <input type="checkbox" class="fasta-box" name="files" value="{{ file }}">
                                {{ file }}
                            </div>
                            <a class="btn btn-sm btn-primary me-2" href="{{ url_for('download_public_file', file_type='fasta', file=file) }}">
                                <i class="fas fa-download"></i>
                            </a>
                        </li>
                    {% endfor %}
                </ul>

                <button class="btn btn-primary mt-2" name="action" value="download">Download selected</button>
            </form>
        </div>

        <!-- Score Files Section -->
        <div class="col-md-6">
            <h2 class="h5 text-secondary">Score Files</h2>
            <form method="POST" action="{{ url_for('bulk_action', file_type='score', is_public=true) }}">
                <div class="mb-2">
                    <input type="checkbox" id="checkAllScore" onclick="toggleAll('score')"> Check all
                </div>
                <ul class="list-group">
                    {% for file in score_files %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <input type="checkbox" class="score-box" name="files" value="{{ file }}">
                                {{ file }}
                            </div>
                            <a class="btn btn-sm btn-primary me-2" href="{{ url_for('download_public_file', file_type='score', file=file) }}">
                                <i class="fas fa-download"></i>
                            </a>
                        </li>
                    {% endfor %}
                </ul>

                <button class="btn btn-primary mt-2" name="action" value="download">Download selected</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
